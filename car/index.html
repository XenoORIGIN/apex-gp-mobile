<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apex GP Mobile · ทดสอบรถ 2026</title>
<style>
  html,body{margin:0;height:100%;background:#15171b;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit;cursor:pointer}
  #stage{position:fixed;inset:0}
  #top{position:fixed;left:calc(14px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
  h1{margin:0;font-size:18px;font-weight:900;font-style:italic;letter-spacing:.5px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
  #tname{font-size:11px;color:#aab1bd;font-weight:700;letter-spacing:2px;margin-top:2px}
  #menuBtn{pointer-events:auto;display:flex;align-items:center;gap:8px;background:#e10600;color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-size:13px;box-shadow:0 6px 18px rgba(225,6,0,.35)}
  #menuBtn svg{width:18px;height:18px}
  #chip{position:fixed;left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));background:rgba(20,22,27,.8);border:1px solid #2f343c;border-radius:10px;padding:7px 12px;font-size:12px;font-weight:700;color:#cfd4dc}
  #chip b{color:#fff}
  #hud{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));background:rgba(20,22,27,.85);border:1px solid #2f343c;border-radius:12px;padding:8px 14px;text-align:right;display:none}
  #hud b{font-size:30px;font-style:italic;font-weight:900}#hud small{font-size:11px;color:#9aa2b0;display:block}#hud .m{font-size:11px;font-weight:800;letter-spacing:1px;color:#36d27a}
  /* แผงตั้งค่า */
  #veil{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s}
  #panel{position:fixed;top:0;bottom:0;right:0;width:min(380px,92vw);background:#121418;border-left:1px solid #2a2e35;transform:translateX(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-right:env(safe-area-inset-right)}
  body.open #veil{opacity:1;pointer-events:auto} body.open #panel{transform:none}
  #pHead{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid #23272e}
  #pHead b{font-size:16px;font-weight:900;font-style:italic;letter-spacing:.5px}
  #pClose{background:#23272e;border:0;color:#fff;width:34px;height:34px;border-radius:10px;font-size:18px;font-weight:700}
  #pBody{flex:1;overflow-y:auto;padding:6px 16px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  .sec{margin-top:14px}.sec>.lb{font-size:10.5px;font-weight:800;letter-spacing:1.6px;color:#8b93a1;margin-bottom:8px}
  #views{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  #views button{background:#1c1f25;color:#e6e9ee;border:1px solid #30353d;border-radius:9px;padding:10px 4px;font-weight:800;font-size:12px}
  #views button small{display:block;font-size:9.5px;font-weight:600;color:#8b93a1;margin-top:2px}
  #views button.on{background:#e10600;border-color:#e10600}#views button.on small{color:#ffd9d6}
  .wcards{display:flex;flex-direction:column;gap:6px}
  .wcards button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:#1c1f25;color:#fff;border:1px solid #30353d;border-radius:10px;padding:10px 12px}
  .wcards button b{font-size:13.5px}.wcards button small{font-size:11px;color:#9aa2b0;margin-top:2px;line-height:1.35}
  .wcards button.on{border-color:#e10600;background:rgba(225,6,0,.12)}
  .sg{display:flex;gap:5px}.sg button{flex:1;background:#1c1f25;color:#dfe3ea;border:1px solid #30353d;border-radius:9px;padding:9px 4px;font-weight:700;font-size:12px}
  .sg button.on{background:#e10600;border-color:#e10600;color:#fff}
  #teams{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  #teams button{aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.2)}
  #teams button.on{border-color:#fff;box-shadow:0 0 0 2px #e10600}
  .tip{font-size:11px;color:#8b93a1;line-height:1.5;margin-top:14px}
  /* เทียบ 3 แบบ */
  #cmpL{position:fixed;inset:0;pointer-events:none;display:none}
  #cmpL div{position:absolute;left:50%;transform:translateX(-50%);font-weight:900;font-size:15px;letter-spacing:.5px;text-shadow:0 1px 4px #000;padding:2px 10px;border-radius:6px;background:rgba(0,0,0,.35)}
  #cmpL i{position:absolute;left:0;right:0;height:2px;background:#000}
  body.cmp #top h1,body.cmp #tname,body.cmp #hud,body.cmp #chip{display:none!important}
</style></head>
<body><div id="stage"></div>
<div id="top"><div><h1>APEX GP MOBILE · 2026</h1><div id="tname"></div></div>
  <button id="menuBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>ตั้งค่า</button></div>
<div id="chip"></div>
<div id="hud"><div class="m" id="hMode">STRAIGHT MODE</div><b id="hSpd">0</b><small>KM/H · เกียร์ <span id="hG">1</span></small></div>
<div id="cmpL"></div>
<div id="veil"></div>
<div id="panel"><div id="pHead"><b>ตั้งค่าการทดสอบ</b><button id="pClose">✕</button></div><div id="pBody">
  <div class="sec"><div class="lb">มุมกล้อง</div><div id="views">
    <button data-view="orbit" class="on">หมุนดู<small>ลากหมุนได้</small></button><button data-view="side">ด้านข้าง<small>&nbsp;</small></button><button data-view="front">ด้านหน้า<small>&nbsp;</small></button>
    <button data-view="rear">ด้านหลัง<small>&nbsp;</small></button><button data-view="top">ด้านบน<small>&nbsp;</small></button><button data-view="drive">วิ่ง<small>รถวิ่งบนถนน</small></button>
    <button data-view="onboard">Onboard<small>มุมคนขับ</small></button><button data-view="rearcam">กล้องหลัง<small>มองปีกหลัง</small></button><button data-view="compare">เทียบ 3 แบบ<small>แบบคลิป F1</small></button>
  </div></div>
  <div class="sec"><div class="lb">ปีกหลัง</div><div class="wcards">
    <button data-rw="std" class="on"><b>ปกติ</b><small>flap ยกขึ้นให้แบน ลดแรงต้านบนทางตรง</small></button>
    <button data-rw="ferrari"><b>Macarena · Ferrari</b><small>flap พลิกจากหน้าไปหลังจนคว่ำ กลไกอยู่ที่มุม endplate สองข้าง</small></button>
    <button data-rw="rb"><b>Red Bull</b><small>หมุนสวนทาง Ferrari: ขอบหลังยกขึ้นแล้วพลิกไปข้างหน้าจนคว่ำ ~150°</small></button>
  </div></div>
  <div class="sec"><div class="lb">ACTIVE AERO</div><div class="sg"><button data-ae="auto" class="on">อัตโนมัติ</button><button data-ae="0">ปิด (โค้ง)</button><button data-ae="1">เปิด (ทางตรง)</button></div></div>
  <div class="sec"><div class="lb">สีทีม</div><div id="teams"></div></div>
  <div class="tip">อัตโนมัติ = ปีกเปิดบนทางตรง ปิดตอนเบรกและเข้าโค้ง (ในมุมนิ่งจะเปิด-ปิดวนให้ดู)<br>ใช้ 2 นิ้วซูม · ลาก 1 นิ้วหมุนกล้อง</div>
</div></div>
